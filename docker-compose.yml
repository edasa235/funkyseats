services:
  db:
    image: postgres:18.3-alpine
    container_name: funkyseats-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: ./backend

    container_name: funkyseats-migrate

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy

    command: npx drizzle-kit migrate


  backend:
    build:
      context: ./backend

    container_name: funkyseats-backend

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    expose:
      - "3001"

    depends_on:
      migrate:
        condition: service_completed_successfully


  frontend:
    build:
      context: ./frontend

    container_name: funkyseats-frontend

    expose:
      - "3000"

    depends_on:
      - backend


  nginx:
    image: nginx:alpine
    container_name: funkyseats-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend


volumes:
  db_data: